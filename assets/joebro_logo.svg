<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer App Icon Shadow -->
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- 'j' Drop Shadow -->
    <filter id="jShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#8B2CE0" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Base App Background Gradient (Pristine Glassy White) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F5F7" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Inner Border Highlight (macOS bevel effect) -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>

    <!-- Gradient for the 'j' Stem (Fun & Vibrant) -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#8B2CE0" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Stem Gloss Highlight (Top Lighting) -->
    <linearGradient id="stemGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Stem Side Shading (3D Tube Effect) -->
    <linearGradient id="stemSideShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="25%" stop-color="#000000" stop-opacity="0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradient for the Dot (Contrasting Bright Warmth) -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#FF5E00" />
    </linearGradient>

    <!-- Dot Radial Gloss -->
    <radialGradient id="dotGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#bgGrad)" filter="url(#appShadow)" />
  
  <!-- Squircle Inner Border Highlight -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="url(#innerStroke)" stroke-width="2" />

  <!-- The "j" Container with Drop Shadow -->
  <g filter="url(#jShadow)">
    
    <!-- === Stem Elements === -->
    
    <!-- Base Color -->
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemGrad)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />
    
    <!-- 3D Side Shading -->
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemSideShadow)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />
    
    <!-- Glossy Top Highlight -->
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemGloss)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />

    <!-- === Dot Elements === -->
    
    <!-- Base Color -->
    <circle cx="312" cy="132" r="32" fill="url(#dotGrad)" />
    
    <!-- Glossy Radial Highlight -->
    <circle cx="312" cy="132" r="32" fill="url(#dotGloss)" />
    
  </g>
</svg>
