<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <filter id="jShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F4F5F7" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E5EA" />
      <stop offset="50%" stop-color="#8E8E93" />
      <stop offset="100%" stop-color="#1C1C1E" />
    </linearGradient>

    <linearGradient id="stemGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stemSideShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#000000" stop-opacity="0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#3A3A3C" />
    </linearGradient>

    <radialGradient id="dotGloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#bgGrad)" filter="url(#appShadow)" />
  
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="url(#innerStroke)" stroke-width="2" />

  <g filter="url(#jShadow)">
    
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemGrad)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />
    
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemSideShadow)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />
    
    <path 
      d="M 312 216 L 312 328 A 56 56 0 0 1 200 328 L 200 304" 
      fill="none" 
      stroke="url(#stemGloss)" 
      stroke-width="64" 
      stroke-linecap="round" 
    />

    <circle cx="312" cy="132" r="32" fill="url(#dotGrad)" />
    
    <circle cx="312" cy="132" r="32" fill="url(#dotGloss)" />
    
  </g>
</svg>
