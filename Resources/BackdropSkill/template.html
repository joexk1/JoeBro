<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JoeBro backdrop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0b; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FRAME = 1000 / 30;             // 30 fps cap
  let scheme = 'dark', raf = 0, last = 0, running = false;
  let w = 0, h = 0, dpr = 1;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  // Replace this with your scene. t is milliseconds.
  const CH = ' .:-=+*#';
  function draw(t) {
    const dark = scheme === 'dark';
    ctx.fillStyle = dark ? '#0a0a0b' : '#f5f4f1';
    ctx.fillRect(0, 0, w, h);
    ctx.font = '14px ui-monospace, Menlo, monospace';
    ctx.textBaseline = 'top';
    const cw = 9, ch = 16;
    for (let y = 0; y < h; y += ch) {
      for (let x = 0; x < w; x += cw) {
        const v = 0.5 + 0.5 * Math.sin(x * 0.012 + t * 0.0004) * Math.cos(y * 0.02 - t * 0.0003);
        const i = Math.floor(v * (CH.length - 1));
        if (i === 0) continue;
        ctx.fillStyle = dark ? `rgba(255,255,255,${0.04 + v * 0.10})` : `rgba(0,0,0,${0.04 + v * 0.10})`;
        ctx.fillText(CH[i], x, y);
      }
    }
  }

  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (now - last < FRAME) return;
    last = now;
    draw(now);
  }
  function resume() { if (running || still) return; running = true; raf = requestAnimationFrame(loop); }
  function pause() { running = false; cancelAnimationFrame(raf); }

  window.jbBackdrop = {
    pause, resume,
    setScheme(s) { scheme = s === 'light' ? 'light' : 'dark'; document.body.style.background = scheme === 'dark' ? '#0a0a0b' : '#f5f4f1'; draw(performance.now()); }
  };
  addEventListener('resize', resize);
  resize();
  resume();
})();
</script>
</body>
</html>
